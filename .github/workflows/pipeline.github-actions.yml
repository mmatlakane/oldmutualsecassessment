name: Terraform Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Security Scan Dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run Security Scan
        working-directory: ./security-automation
        run: |
          chmod +x security-scan.py
          ./security-scan.py .. --format all

      - name: Upload Security Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            security-automation/results/*.html
            security-automation/results/*.json
          if-no-files-found: warn

  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::466021236912:role/GitHubActionsTerraformRole
          aws-region: eu-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./landing-zone-tiers/starter/aws
        run: |
          terraform init \
            -backend-config="bucket=landing-zone-pipeline-tfstate" \
            -backend-config="key=landing-zone/starter/aws/terraform.tfstate" \
            -backend-config="region=eu-west-1"

      - name: Terraform Validate
        working-directory: ./landing-zone-tiers/starter/aws
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./landing-zone-tiers/starter/aws
        run: terraform plan